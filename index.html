<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Performance Analyzer</h1>
        <p>Track your performance and get personalized suggestions!</p>

        <label>👤 Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <h2>📚 Add Subjects</h2>

        <input type="text" id="subjectName" placeholder="Subject name">
        <input type="number" id="subjectMark" placeholder="Marks">

        <button onclick="addSubject()">➕ Add Subject</button>

        <div id="subjectList"></div>

        <button onclick="analyzePerformance()">
            📊 Analyze Performance
        </button>

        <button onclick="resetAll()">
            🔄 Reset
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
